<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Ubicación y Pago
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ubicación y Pago</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="section">
    <h2>Mi ubicación</h2>

    <ion-button expand="block" (click)="loadCurrentLocation()" [disabled]="locating">
      <ion-icon slot="start" name="locate"></ion-icon>
      {{ locating ? 'Buscando...' : 'Ver mi ubicación actual' }}
    </ion-button>

    <p class="error" *ngIf="locationError">{{ locationError }}</p>

    <div #map class="leaflet-map"></div>
  </div>

  <div class="section">
    <h2>Pagar con PayPal</h2>
    <div id="paypal-button-container"></div>
    <p *ngIf="paypalMessage">{{ paypalMessage }}</p>
  </div>
</ion-content>
